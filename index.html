<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำนวณความชันเทรล</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eceee4;--panel:#fafaf4;--ink:#1b2a21;--mute:#667366;--line:#cdd3c3;--accent:#2c5a43;--onaccent:#f4f7ef;--field:#fff;--bad:#c4503f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--panel:#1b2620;--ink:#e5ebdf;--mute:#93a095;--line:#33423a;--accent:#7fc29c;--onaccent:#102017;--field:#141d18;--bad:#e0705e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a15;--panel:#1b2620;--ink:#e5ebdf;--mute:#93a095;--line:#33423a;--accent:#7fc29c;--onaccent:#102017;--field:#141d18;--bad:#e0705e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:18px 14px 48px}
h1{font-size:1.05rem;font-weight:500;margin:0 0 12px;color:var(--mute)}
h2{font-size:1rem;margin:0 0 8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.hero{margin-bottom:14px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:clamp(3rem,12vw,4.8rem);font-weight:700;line-height:1;letter-spacing:-.03em}
.big span{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px 12px;margin-top:12px}
.stats div{font-size:.78rem;color:var(--mute)}
.stats strong{display:block;font-size:1rem;color:var(--ink);font-weight:500}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.side{height:440px}}
.side{position:relative;min-height:400px;padding:0}
.side .in{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px}
#segs{overflow-y:auto;flex:1;min-height:0;margin-top:6px}
.tb{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.grp{display:flex;gap:6px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.ib{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sh .ib{width:28px;height:28px;border:0;background:none}
.ic{width:18px;height:18px;display:block}
[data-ic]{display:inline-flex;align-items:center;justify-content:center;line-height:0}
.tabs button{padding:6px 12px;font-size:.88rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number],input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
label{display:flex;flex-direction:column;font-size:.78rem;color:var(--mute);gap:3px}
input[type=range]{width:100%;accent-color:var(--accent)}
#cv{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.ter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ter button{font-size:.8rem;display:flex;align-items:center;gap:6px;padding:4px 10px}
.ter i{width:12px;height:12px;border-radius:3px;display:inline-block}
.slbox{margin-top:6px}
.info{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ih{font-weight:700}
.seg{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel)}
.seg.open{border-color:var(--accent)}
.seg.dragover{border-color:var(--bad)}
.sh{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;cursor:pointer}
.grip{cursor:grab;color:var(--mute);display:flex}
.tag{font-weight:700;font-size:.8rem;padding:2px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.lbl{flex:1;font-size:.86rem}
.td{width:10px;height:10px;border-radius:3px}
.sb{display:none;padding:0 10px 10px}
.seg.open .sb{display:block}
.row3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.meta{font-size:.78rem;color:var(--mute);margin-top:6px}
.srow{display:flex;gap:8px}
.shd{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.note{font-size:.8rem;color:var(--mute);margin:4px 0}
.err{color:var(--bad);font-size:.85rem;margin:4px 0}
.sv{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.sv label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.9rem;flex:1}
.sv input{width:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:.78rem}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;line-height:1.4;padding:5px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-125%);z-index:2;text-align:left}
.bar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:8px;background:var(--bg)}
.mb{border:0;background:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0}
.mb b{font-weight:500}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.bar .tabs{display:flex;gap:2px}
.bar .tabs button{border:0;background:none;width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.bar .tabs button.on{background:var(--accent);color:var(--onaccent)}
@media(max-width:560px){.mb b{display:none}}
.zc{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zc button{width:30px;height:30px;padding:0;background:var(--panel);opacity:.92;display:flex;align-items:center;justify-content:center}
.srow2{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.srow2 label{width:200px}
.gt{position:fixed;z-index:50;background:var(--ink);color:var(--bg);font-size:.78rem;padding:4px 9px;border-radius:6px;pointer-events:none;max-width:260px}
.hgrid{display:grid;grid-template-columns:minmax(130px,.6fr) repeat(3,minmax(0,1fr));gap:14px}
.hg{border-left:1px solid var(--line);padding-left:14px}
.hl{font-size:.72rem;color:var(--mute);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.hg .stats{grid-template-columns:1fr 1fr;margin-top:0}
.inf{cursor:help;font-size:.85rem}
.hbig .big b{font-size:clamp(2.8rem,8vw,4.2rem)}
@media(max-width:900px){.hgrid{grid-template-columns:1fr 1fr}.hg{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}}
@media(max-width:560px){.hgrid{grid-template-columns:1fr}}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.sbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;font-size:.85rem}
.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.act{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;margin-bottom:4px;font-size:.85rem}
.act small{color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style>
</head>
<body>
<main>
<div class="top"><h1>คำนวณความชันเทรล</h1><div class="acct" id="acct"></div></div>
<div class="box" id="login" hidden style="margin-bottom:14px"><label style="max-width:320px">อีเมล<input type="text" id="email" autocomplete="email" placeholder="you@example.com"></label><div style="margin-top:8px"><button class="pri" id="loginGo">ส่งลิงก์เข้าสู่ระบบ</button></div><p class="note" id="loginMsg"></p></div>
<section class="box" id="stv" hidden style="margin-bottom:14px">
  <div class="shd" style="margin:0 0 8px"><strong>กิจกรรมจาก Strava</strong><button class="ib" id="stvX" data-tip="ปิด" aria-label="ปิด">×</button></div>
  <div class="srow2" style="margin:0 0 8px"><label>ค้นหาชื่อ<input type="text" id="q"></label><label>ตั้งแต่วันที่<input type="date" id="dFrom"></label><label>ถึงวันที่<input type="date" id="dTo"></label></div>
  <p class="note" id="stvMsg"></p>
  <div id="stvList" style="max-height:300px;overflow-y:auto"></div>
  <button id="stvMore" hidden style="margin-top:8px">โหลดเพิ่ม</button>
</section>

<section class="box hero" aria-live="polite">
  <div class="hgrid">
    <div class="hbig"><div class="hl">ความชันเฉลี่ย</div><div class="big"><b id="avg">0.0</b><span>%</span></div></div>
    <div class="hg"><div class="hl">เส้นทาง</div><div class="stats" id="hsA"></div></div>
    <div class="hg"><div class="hl">ความยาก <span class="inf" tabindex="0" role="img" aria-label="คำอธิบาย" data-tip="คะแนนความยาก = ระยะเทียบเท่าทางราบ × 10 สะสมไม่มีเพดาน คิดจากระยะทาง ความชัน ลักษณะทาง และการขึ้นลงถี่ ส่วนความหนักต่อกม. ดูความโหดต่อหนึ่งกิโลเมตร (0 ถึง 100)">ⓘ</span></div><div class="stats" id="hsB"></div></div>
    <div class="hg"><div class="hl">เวลาโดยประมาณ <span class="inf" tabindex="0" role="img" aria-label="คำอธิบาย" data-tip="เวลาตาม UTMB Index เป็นค่าประมาณจากเส้นโค้งที่ตั้งเอง เพราะ UTMB ไม่เปิดเผยสูตรแปลงคะแนนเป็นเวลา ส่วนเวลาตามเพซทางราบใช้ระยะเทียบเท่าของแอปนี้">ⓘ</span></div><div class="stats" id="hsC"></div>
      <div class="srow2"><label>UTMB Index<input type="number" id="ui" min="0" max="1000" step="10" value="500" aria-label="UTMB Index 0 ถึง 1000"></label><label>เพซทางราบ (นาที/กม.)<input type="number" id="pace" value="6" step="0.1" min="2"></label></div></div>
  </div>
</section>

<div class="grid">
  <section class="box" id="cbox">
    <div class="bar" role="toolbar" aria-label="เครื่องมือกราฟ">
      <button class="mb" id="bUp" data-tip="นำเข้าไฟล์ GPX" aria-label="นำเข้าไฟล์ GPX"><span data-ic="upload"></span></button>
      <i class="sep"></i>
      <button class="mb" id="bRev" data-tip="กลับทิศทางเส้นทาง (วิ่งย้อนกลับ)" aria-label="กลับทิศทางเส้นทาง"><span data-ic="swap"></span></button>
      
      <button class="mb" id="bCut" data-tip="ตัดช่วงบนกราฟ" aria-label="ตัดช่วงบนกราฟ"><span data-ic="cut"></span></button>
      <i class="sep"></i>
      <div class="tabs"><button data-v="p" class="on" data-tip="กราฟโปรไฟล์ความสูง" aria-label="กราฟโปรไฟล์ความสูง"><span data-ic="chart"></span></button><button data-v="m" data-tip="แผนที่เส้นทาง" aria-label="แผนที่เส้นทาง"><span data-ic="map"></span></button><button data-v="3" data-tip="มุมมอง 3D" aria-label="มุมมอง 3D"><span data-ic="cube"></span></button></div>
      <i class="sep"></i>
      <button class="mb" id="bUndo" data-tip="เลิกทำ" aria-label="เลิกทำ" disabled><span data-ic="undo"></span></button>
      <button class="mb" id="bRedo" data-tip="ทำซ้ำ" aria-label="ทำซ้ำ" disabled><span data-ic="redo"></span></button>
    </div>
    <input type="file" id="gpx" accept=".gpx,.tcx" hidden>
    <div class="ter" id="ter"></div>
    <p class="note" id="hint"></p>
    <div style="position:relative"><svg id="cv" viewBox="0 0 700 270" role="img" aria-label="กราฟโปรไฟล์ความสูง"></svg><div id="tip" class="tip" hidden></div><div class="zc"><button id="zi" data-tip="ซูมเข้า" aria-label="ซูมเข้า"><span data-ic="plus"></span></button><button id="zo" data-tip="ซูมออก" aria-label="ซูมออก"><span data-ic="minus"></span></button><button id="zr" data-tip="รีเซ็ตซูม" aria-label="รีเซ็ตซูม"><span data-ic="fit"></span></button></div></div>
    <input type="range" id="pan" min="0" max="1000" value="0" hidden aria-label="เลื่อนช่วงที่ซูม">
    <div class="slbox" id="sl" hidden><label>ความไวจุดเปลี่ยนความชัน: <span id="tolV"></span><input type="range" id="tol" min="1" max="150" step="1" value="10" aria-label="ความไวจุดเปลี่ยนความชัน"></label><p class="note">เลื่อนซ้ายแบ่งละเอียดขึ้น เลื่อนขวารวมช่วงที่ความชันใกล้กัน</p></div>
    <p class="err" id="err" role="alert"></p>
    <div class="info" id="info"></div>
  </section>

  <aside class="box side"><div class="in">
    <div class="srow"><input type="text" id="name" placeholder="ชื่อเส้นทาง" aria-label="ชื่อเส้นทาง"><button class="ib" id="bSave" data-ic="save" data-tip="บันทึกเส้นทาง" aria-label="บันทึกเส้นทาง"></button></div>
    <div class="shd"><strong>รายการช่วง</strong><button class="ib" id="bAdd" data-ic="plus" data-tip="เพิ่มช่วง" aria-label="เพิ่มช่วง"></button></div>
    <div id="segs"></div>
  </div></aside>
</div>

<section class="box">
  <h2>เส้นทางที่บันทึกและการเปรียบเทียบ</h2>
  <div class="grp" style="margin-bottom:6px"><button class="ib" id="bExp" data-tip="ส่งออกเส้นทางที่บันทึกเป็นไฟล์สำรอง" aria-label="ส่งออกไฟล์สำรอง"><span data-ic="download"></span></button><button class="ib" id="bImp" data-tip="นำเข้าไฟล์สำรองเส้นทาง" aria-label="นำเข้าไฟล์สำรอง"><span data-ic="upload"></span></button><input type="file" id="jsonIn" accept=".json" hidden><button class="ib" id="bUpLocal" data-ic="cloudup" hidden data-tip="อัปโหลดเส้นทางที่เก็บในเครื่องนี้ขึ้นบัญชี" aria-label="อัปโหลดเส้นทางในเครื่องขึ้นบัญชี"></button></div>
  <div id="saved"></div>
  <div id="cmp"></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const P={upload:"M12 16V4m0 0L8 8m4-4l4 4M4 20h16",swap:"M7 4v14m0 0l-3-3m3 3l3-3M17 20V6m0 0l-3 3m3-3l3 3",mount:"M3 19l6-11 4 7 3-4 5 8z",cut:"M6 6a2 2 0 100 4 2 2 0 000-4zM6 14a2 2 0 100 4 2 2 0 000-4zM8 9l12 9M8 15L20 6",undo:"M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3",redo:"M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3",plus:"M12 5v14M5 12h14",trash:"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3",save:"M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6",grip:"M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01",minus:"M5 12h14",fit:"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5",download:"M12 4v12m0 0l-4-4m4 4l4-4M4 20h16",user:"M20 21a8 8 0 00-16 0M12 12a4 4 0 100-8 4 4 0 000 8z",out:"M9 4H5v16h4M16 8l4 4-4 4M20 12H9",act:"M3 12h4l3-8 4 16 3-8h4",cloudup:"M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18M12 12v7m0-7l-3 3m3-3l3 3",chart:"M3 17l5-6 4 4 5-8 4 5",map:"M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14",cube:"M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"};
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+P[n]+'"/></svg>';
document.querySelectorAll("[data-ic]").forEach(b=>b.innerHTML=ic(b.dataset.ic));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const TH=3.2,DSTEP=0.008;
const TER=[{n:"ถนน/ทางเรียบ",f:.95,c:"#8a8f98"},{n:"เทรลทั่วไป",f:1,c:"#5b9a6b"},{n:"ขรุขระ/หิน/รากไม้",f:1.15,c:"#c9964a"},{n:"ลื่น/โคลน/ทราย",f:1.25,c:"#9a6bb5"},{n:"ปีนป่าย/ใช้มือ",f:1.5,c:"#c4503f"}];
const S={segs:[{d:5,s:1000,e:1400,g:8,t:1}],rev:false,gpx:false,sel:0,end:0,mode:"sel",tr:2,view:"p",hov:-1,hi:-1,yaw:-.7,ph:.9,cmp:[],zk:1,zs:0,mk:1,mx:350,my:135,z3:1,dm:"f"};
let G=null,U=[],R=[],pend=null,drag=-1,d3=null,dragI=-1,SV=[];
const r3=v=>Math.round(v*1000)/1000,r1=v=>Math.round(v*10)/10;
const sg=(n,k)=>(n>0?"+":"")+n.toFixed(k);
const tq=q=>TER[S.gpx&&G&&q.ia!=null?G.terr[(q.ia+q.ib)>>1]:(q.t==null?1:q.t)];
function leaveGpx(){if(S.gpx&&G)S.segs.forEach(q=>{if(q.ia!=null)q.t=G.terr[(q.ia+q.ib)>>1]});S.gpx=false}
const IDX=[[0,13.5],[100,11.2],[300,8.7],[500,6.8],[700,5.2],[900,3.75],[1000,3.3]];
function pIdx(v){v=Math.max(0,Math.min(1000,v));for(let i=1;i<IDX.length;i++){if(v<=IDX[i][0]){const a=IDX[i-1],b=IDX[i];return a[1]+(b[1]-a[1])*(v-a[0])/(b[0]-a[0])}}return IDX[IDX.length-1][1]}
const uiV=()=>{const v=parseFloat($("#ui").value);return isNaN(v)?500:v},paceV=()=>parseFloat($("#pace").value)||6;
function tIdx(ek){return ek*pIdx(uiV())*(1+.0012*Math.max(0,ek-50))}
const lab=s=>s<25?"เบา":s<50?"ปานกลาง":s<75?"ยาก":"โหด";
function gc(g){if(g>=0){const t=Math.min(g/20,1);return"hsl("+Math.round(100-92*t)+",58%,42%)"}const t=Math.min(-g/20,1);return"hsl(198,"+Math.round(35+25*t)+"%,"+Math.round(52-10*t)+"%)"}

function calc(){let x=0;return S.segs.map(q=>{const d=Math.max(+q.d||0,0),s=+q.s||0;let e,g;if(S.rev){g=+q.g||0;e=s+g/100*d*1000}else{e=+q.e||0;g=d>0?(e-s)/(d*10):0}const r={d,x0:x,x1:x+d,y0:s,y1:e,g,dz:e-s};x+=d;return r})}
function cost(g){g=Math.max(-.45,Math.min(.45,g/100));return 155.4*g**5-30.4*g**4-43.3*g**3+46.3*g**2+19.5*g+3.6}
function hy(a,b){
  let g=0,l=0,n=0,base=G.y[a],hi=base,lo=base,m=0;
  for(let i=a+1;i<=b;i++){const y=G.y[i];
    if(m>=0&&y>hi)hi=y;
    if(m<=0&&y<lo)lo=y;
    if(m<=0&&y-lo>=TH){if(m<0){l+=base-lo;n++}base=lo;m=1;hi=y}
    else if(m>=0&&hi-y>=TH){if(m>0){g+=hi-base;n++}base=hi;m=-1;lo=y}
  }
  if(m>0)g+=hi-base;else if(m<0)l+=base-lo;
  return{gain:g,loss:l,turns:n};
}
function effort(k,rows){
  const q=S.segs[k],f=tq(q).f;
  if(S.gpx&&G&&q.ia!=null){let e=0,i=q.ia;while(i<q.ib){let j=i+1;while(j<q.ib&&G.x[j]-G.x[i]<.1)j++;const dd=G.x[j]-G.x[i];if(dd>0)e+=dd*cost((G.y[j]-G.y[i])/(dd*10))/3.6*TER[G.terr[i]].f;i=j}return e}
  return rows[k].d*cost(rows[k].g)/3.6*f;
}
function stats(rows,a,b){
  let d=0,dz=0,eq=0,gain=0,loss=0,turns=0;
  for(let k=a;k<=b;k++){d+=rows[k].d;dz+=rows[k].dz;eq+=effort(k,rows)}
  if(S.gpx&&G&&S.segs[a].ia!=null&&S.segs[b].ib!=null){const t=hy(S.segs[a].ia,S.segs[b].ib);gain=t.gain;loss=t.loss;turns=t.turns}
  else for(let k=a;k<=b;k++){const z=rows[k].dz;if(z>0)gain+=z;else loss-=z}
  const eqA=eq*(1+.02*(d>0?turns/d:0)),ratio=d>0?eqA/d:1,inten=Math.round(Math.max(0,Math.min(1,(ratio-1)/.9))*100),score=Math.round(eqA*10);
  return{x0:rows[a].x0,x1:rows[b].x1,y0:rows[a].y0,y1:rows[b].y1,d,dz,g:d>0?dz/(d*10):0,gain,loss,turns,eq:eqA,score,inten,ratio};
}

/* history */
function snap(){return{segs:S.segs.map(q=>({...q})),rev:S.rev,gpx:S.gpx,G:G,tol:$("#tol").value,terr:G&&G.terr?Uint8Array.from(G.terr):null,x:G?G.x:null,dm:S.dm}}
function sync(){$("#bUndo").disabled=!U.length;$("#bRedo").disabled=!R.length}
function push(){U.push(snap());if(U.length>60)U.shift();R=[];sync()}
function restore(p){S.segs=p.segs.map(q=>({...q}));S.rev=p.rev;S.gpx=p.gpx;G=p.G;if(G){if(p.terr)G.terr=Uint8Array.from(p.terr);if(p.x)G.x=p.x}S.dm=p.dm;$("#tol").value=p.tol;S.sel=-1;S.end=-1;S.hov=-1;render()}
function undo(){if(!U.length)return;R.push(snap());restore(U.pop());sync()}
function redo(){if(!R.length)return;U.push(snap());restore(R.pop());sync()}

/* GPX */
function hav(a,b){const k=Math.PI/180,dl=(b[0]-a[0])*k,dn=(b[1]-a[1])*k,h=Math.sin(dl/2)**2+Math.cos(a[0]*k)*Math.cos(b[0]*k)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function mk(a,b,t){return{d:r3(G.x[b]-G.x[a]),s:Math.round(G.y[a]),e:Math.round(G.y[b]),g:0,ia:a,ib:b,t:t==null?1:t}}
function rdp(x,y,tol){
  const keep=new Uint8Array(x.length);keep[0]=1;keep[x.length-1]=1;const st=[[0,x.length-1]];
  while(st.length){const[a,b]=st.pop();let md=0,mi=-1;
    for(let i=a+1;i<b;i++){const t=(x[i]-x[a])/((x[b]-x[a])||1),dy=Math.abs(y[i]-(y[a]+t*(y[b]-y[a])));if(dy>md){md=dy;mi=i}}
    if(md>tol&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b])}}
  const o=[];keep.forEach((v,i)=>{if(v)o.push(i)});return o;
}
function applyTol(tol,auto){
  let idx=rdp(G.x,G.y,tol);
  if(auto){while(idx.length>31&&tol<150){tol=Math.min(150,Math.ceil(tol*1.3));idx=rdp(G.x,G.y,tol)}}
  const segs=[];for(let k=1;k<idx.length;k++)segs.push(mk(idx[k-1],idx[k],1));
  S.segs=segs;S.gpx=true;S.rev=false;S.sel=-1;S.end=-1;$("#tol").value=tol;render();
}
function importPts(pts,name){
      if(pts.length<2)throw 0;
      const sm=pts.map((p,i)=>{let s=0,n=0;for(let k=Math.max(0,i-3);k<=Math.min(pts.length-1,i+3);k++){s+=pts[k][2];n++}return s/n});
      const w=4,sp=pts.map((p,i)=>{let a=0,o=0,n=0;for(let k=Math.max(0,i-w);k<=Math.min(pts.length-1,i+w);k++){a+=pts[k][0];o+=pts[k][1];n++}return[a/n,o/n]});
      const cr=[0],cf=[0];for(let i=1;i<pts.length;i++){cr.push(cr[i-1]+hav(pts[i-1],pts[i]));cf.push(cf[i-1]+hav(sp[i-1],sp[i]))}
      const kept=[0];let li=0;for(let i=1;i<pts.length;i++){if(hav(sp[li],sp[i])>=DSTEP){kept.push(i);li=i}}
      if(kept[kept.length-1]!==pts.length-1)kept.push(pts.length-1);
      if(kept.length<2||cr[cr.length-1]<=0)throw 0;
      const xr=kept.map(i=>cr[i]),k=Math.cos(pts[0][0]*Math.PI/180)*111320;
      push();
      G={x:xr,xr,y:kept.map(i=>sm[i]),px:kept.map(i=>(pts[i][1]-pts[0][1])*k),py:kept.map(i=>(pts[i][0]-pts[0][0])*111320),terr:new Uint8Array(kept.length).fill(1)};
      let lo=1e9,hi=-1e9;G.y.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)});
      $("#name").value=name;
      applyTol(Math.max(3,Math.round((hi-lo)*.03)),true);
}
$("#bUp").onclick=()=>$("#gpx").click();
$("#gpx").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{$("#err").textContent="";
    try{
      const doc=new DOMParser().parseFromString(rd.result,"application/xml");
      const tcx=/\.tcx$/i.test(f.name),tx=(p,n)=>{const e=p.getElementsByTagName(n)[0];return e?parseFloat(e.textContent):NaN};
      const pts=(tcx?[...doc.getElementsByTagName("Trackpoint")].map(p=>[tx(p,"LatitudeDegrees"),tx(p,"LongitudeDegrees"),tx(p,"AltitudeMeters")]):[...doc.getElementsByTagName("trkpt")].map(p=>{const el=p.getElementsByTagName("ele")[0];return[parseFloat(p.getAttribute("lat")),parseFloat(p.getAttribute("lon")),el?parseFloat(el.textContent):NaN]})).filter(p=>!isNaN(p[0])&&!isNaN(p[1])&&!isNaN(p[2]));
      if(pts.length<2)throw 0;
      importPts(pts,f.name.replace(/\.(gpx|tcx)$/i,""));
    }catch(x){$("#err").textContent="อ่านไฟล์ไม่ได้ ไฟล์ GPX หรือ TCX ต้องมีจุดพิกัดพร้อมค่าความสูง"}
  };
  rd.readAsText(f);e.target.value="";
};

function reverseRoute(){
  if(!S.segs.length)return;
  push();
  const rows=calc(),gp=S.gpx&&G&&S.segs.every(q=>q.ia!=null);
  let segs;
  if(gp){const n=G.x.length;segs=S.segs.map(q=>({ia:n-1-q.ib,ib:n-1-q.ia})).reverse()}
  else segs=S.segs.map((q,i)=>({d:q.d,s:r1(rows[i].y1),e:r1(rows[i].y0),g:Math.round(-rows[i].g*100)/100,t:q.t==null?1:q.t})).reverse();
  if(G){const n=G.x.length,tot=G.x[n-1],rv=a=>Array.from(a).reverse(),x=rv(G.x).map(v=>tot-v);G={x,xr:x,y:rv(G.y),px:rv(G.px),py:rv(G.py),terr:Uint8Array.from(rv(G.terr))}}
  S.segs=gp?segs.map(q=>mk(q.ia,q.ib,1)):segs;
  S.sel=-1;S.end=-1;S.hov=-1;S.hi=-1;S.zk=1;S.zs=0;render();
}

/* chart helpers */
const W=700,H=270,L=8,R2=8,T=16,B=36;
function geo(rows){
  const tot=rows.length?rows[rows.length-1].x1:0;let lo=1e9,hi=-1e9;
  rows.forEach(r=>{lo=Math.min(lo,r.y0,r.y1);hi=Math.max(hi,r.y0,r.y1)});
  if(S.gpx&&G)G.y.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)});
  if(hi-lo<20){const m=(hi+lo)/2;lo=m-10;hi=m+10}
  const p=(hi-lo)*.08;lo-=p;hi+=p;
  const k=S.zk,v0=Math.min(S.zs*tot,tot*(1-1/k)),v1=v0+tot/k;
  return{tot,lo,hi,p,v0,v1,X:v=>L+(v-v0)/((v1-v0)||1)*(W-L-R2),Y:v=>T+(1-(v-lo)/(hi-lo))*(H-T-B),base:H-B};
}
function prof(q,g,c){
  const st=Math.max(1,Math.floor((q.ib-q.ia)/150)),pts=[];
  for(let i=q.ia;i<q.ib;i+=st)pts.push(g.X(G.x[i])+","+g.Y(G.y[i]));
  pts.push(g.X(G.x[q.ib])+","+g.Y(G.y[q.ib]));
  const f=pts[0].split(",")[0],l=pts[pts.length-1].split(",")[0],p=pts.join(" ");
  return'<polygon points="'+p+" "+l+","+g.base+" "+f+","+g.base+'" fill="'+c+'" fill-opacity=".38"/><polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round"/>';
}
function drawP(rows){
  const g=geo(rows);
  if(g.tot<=0)return'<text x="350" y="130" text-anchor="middle" fill="var(--mute)" font-size="15">ใส่ระยะทางเพื่อดูกราฟ</text>';
  let h="";const gp=S.gpx&&G;
  rows.forEach((r,i)=>{
    if(r.d<=0)return;const q=S.segs[i],c=gc(r.g),x0=g.X(r.x0),x1=g.X(r.x1);
    if(gp&&q.ia!=null)h+=prof(q,g,c);
    else{const y0=g.Y(r.y0),y1=g.Y(r.y1);h+='<polygon points="'+x0+","+y0+" "+x1+","+y1+" "+x1+","+g.base+" "+x0+","+g.base+'" fill="'+c+'" fill-opacity=".38"/><line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y1+'" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/>'}
    if(gp&&q.ia!=null){let a=q.ia;for(let i=q.ia+1;i<=q.ib;i++){if(i===q.ib||G.terr[i]!==G.terr[a]){h+='<rect x="'+g.X(G.x[a])+'" y="'+(g.base+8)+'" width="'+Math.max(g.X(G.x[i])-g.X(G.x[a]),1)+'" height="7" fill="'+TER[G.terr[a]].c+'"/>';a=i}}}
    else h+='<rect x="'+x0+'" y="'+(g.base+8)+'" width="'+Math.max(x1-x0,1)+'" height="7" fill="'+tq(q).c+'"/>';
    if(S.sel>=0&&i>=S.sel&&i<=S.end)h+='<rect x="'+x0+'" y="'+T+'" width="'+(x1-x0)+'" height="'+(g.base-T)+'" fill="var(--ink)" fill-opacity=".1"/>';
    else if(i===S.hi)h+='<rect x="'+x0+'" y="'+T+'" width="'+(x1-x0)+'" height="'+(g.base-T)+'" fill="var(--ink)" fill-opacity=".05"/>';
  });
  for(let k=0;k<rows.length-1;k++){
    const bx=g.X(rows[k].x1),hv=k===S.hov&&S.mode!=="ter";
    h+='<line x1="'+bx+'" y1="'+T+'" x2="'+bx+'" y2="'+g.base+'" stroke="'+(hv?"var(--bad)":"var(--line)")+'" stroke-width="'+(hv?3:1.2)+'"'+(hv?"":' stroke-dasharray="3 3"')+'/>';
    if(hv){const lx=Math.max(62,Math.min(W-62,bx));h+='<rect x="'+(lx-60)+'" y="1" width="120" height="17" rx="4" fill="var(--bad)"/><text x="'+lx+'" y="13.5" text-anchor="middle" font-size="11" fill="#fff">คลิกเพื่อลบเส้นแบ่ง</text>'}
  }
  h+='<line x1="'+L+'" y1="'+g.base+'" x2="'+(W-R2)+'" y2="'+g.base+'" stroke="var(--line)"/>';
  h+='<text x="'+L+'" y="'+(H-3)+'" fill="var(--mute)" font-size="12">'+g.v0.toFixed(1)+' กม.</text><text x="'+(W-R2)+'" y="'+(H-3)+'" text-anchor="end" fill="var(--mute)" font-size="12">'+g.v1.toFixed(1)+' กม.</text>';
  h+='<text x="'+(W-R2)+'" y="'+(T+10)+'" text-anchor="end" fill="var(--mute)" font-size="12">'+Math.round(g.hi-g.p)+' ม.</text>';
  h+='<line id="hl" y1="'+T+'" y2="'+g.base+'" stroke="var(--ink)" stroke-opacity=".5" stroke-dasharray="2 3" visibility="hidden" pointer-events="none"/><circle id="hd" r="5.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5" visibility="hidden" pointer-events="none"/>';
  return h;
}
const noG='<text x="350" y="135" text-anchor="middle" fill="var(--mute)" font-size="15">ต้องนำเข้าไฟล์ GPX ก่อนจึงจะดูมุมมองนี้ได้</text>';

/* chart interaction */
const cv=$("#cv");
function kmAt(x){const rows=calc(),tot=rows.length?rows[rows.length-1].x1:0,r=cv.getBoundingClientRect(),k=S.zk,v0=Math.min(S.zs*tot,tot*(1-1/k)),sp=tot/k,f=((x-r.left)/r.width*W-L)/(W-L-R2);return{rows,tot,f,km:v0+f*sp,pxKm:r.width/W*(W-L-R2)/(sp||1)}}
function idxOf(rows,km){let k=rows.length-1;for(let i=0;i<rows.length;i++){if(km<=rows[i].x1){k=i;break}}return k}
function yAtKm(km){const n=G.x.length;let lo=0,hi=n-1;while(lo<hi){const m=(lo+hi)>>1;if(G.x[m]<km)lo=m+1;else hi=m}const i=Math.max(1,lo),a=i-1,t=Math.max(0,Math.min(1,(km-G.x[a])/((G.x[i]-G.x[a])||1)));return G.y[a]+(G.y[i]-G.y[a])*t}
function probe(km,rows,i){
  const r=rows[i];
  if(S.gpx&&G){const tot=G.x[G.x.length-1],k1=Math.max(0,km-.05),k2=Math.min(tot,km+.05);return{y:yAtKm(Math.max(0,Math.min(tot,km))),g:k2>k1?(yAtKm(k2)-yAtKm(k1))/((k2-k1)*10):0}}

function hovAt(rows,km,pxKm){let b=-1;for(let k=0;k<rows.length-1;k++){if(Math.abs(rows[k].x1-km)*pxKm<8){b=k;break}}return b}

function cutAt(km,rows){

  if(Ls.length>1){
    const so=[...Ls].sort((a,b)=>b.eq-a.eq),h=so[0],e=so[so.length-1],it=[...Ls].sort((a,b)=>b.inten-a.inten)[0];
    if(e.eq>0)vd='<p class="ih">'+(h.eq/e.eq-1<.03?'งานรวมของทุกเส้นทางใกล้เคียงกัน (ต่างกันไม่ถึง 3%)':'งานรวม: '+esc(h.name)+' ยากกว่า '+esc(e.name)+' ประมาณ '+Math.round((h.eq/e.eq-1)*100)+'% ('+h.eq.toFixed(1)+' เทียบกับ '+e.eq.toFixed(1)+' กม.เทียบเท่า)')+'</p><p class="note">ความหนักต่อกิโลเมตรสูงสุด: '+esc(it.name)+' ('+it.inten+'/100) ซึ่งอาจต่างจากงานรวม เพราะเส้นทางยาวแต่ลาดเรียบก็เหนื่อยสะสมได้</p>';
  }
  const bars=Ls.map((r,i)=>'<div style="display:flex;align-items:center;gap:8px;font-size:.82rem;margin:3px 0"><span style="width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.name)+'</span><div style="flex:1;background:var(--line);border-radius:4px;height:10px"><div style="width:'+Math.round(r.eq/me*100)+'%;height:10px;border-radius:4px;background:'+col(i)+'"></div></div><span style="width:90px;text-align:right">'+r.eq.toFixed(1)+' กม.</span></div>').join("");
  const svg='<svg viewBox="0 0 700 190" style="width:100%;height:auto;display:block;margin-top:8px" role="img" aria-label="เปรียบเทียบโปรไฟล์ความสูง">'+Ls.map((r,i)=>'<polyline points="'+r.pf.map(p=>X(p[0])+","+Y(p[1]-r.pf[0][1])).join(" ")+'" fill="none" stroke="'+col(i)+'" stroke-width="2.5" stroke-linejoin="round"/>').join("")+'</svg>';
  box.innerHTML=vd+'<p class="note">แถบแสดงงานรวม (ระยะเทียบเท่าทางราบ รวมระยะทาง ความชัน ลักษณะทาง และการขึ้นลงถี่)</p>'+bars+svg+'<p class="note">กราฟนับความสูงสัมพัทธ์จากจุดเริ่มของแต่ละเส้นทาง</p><div class="tw"><table><tr><th>เส้นทาง</th><th>ระยะ</th><th>ไต่ขึ้น</th><th>ลง</th><th>ชันเฉลี่ย</th><th>ชันสุด</th><th>งานรวม</th><th>ความหนัก/กม.</th><th>ความยากรวม</th><th>เวลาตามเพซทางราบ</th><th>เวลาตาม UTMB Index</th></tr>'+Ls.map((r,i)=>'<tr><td><span class="dot" style="background:'+col(i)+'"></span>'+esc(r.name)+'</td><td>'+r.tot.toFixed(1)+' กม.</td><td>'+Math.round(r.gain)+' ม.</td><td>'+Math.round(r.loss)+' ม.</td><td>'+r.avg.toFixed(1)+'%</td><td>'+r.mx.toFixed(1)+'%</td><td>'+r.eq.toFixed(1)+' กม.</td><td>'+r.inten+' · '+lab(r.inten)+'</td><td>'+Math.round(r.eq*10).toLocaleString("th-TH")+' แต้ม</td><td>'+fmtT(r.eq*pace)+'</td><td>'+fmtT(tIdx(r.tot+r.gain/100))+'</td></tr>').join("")+'</table></div>';
}
function zoom(f,e){
  const r=cv.getBoundingClientRect(),cx=e?e.clientX:r.left+r.width/2,cy=e?e.clientY:r.top+r.height/2;
  if(S.view==="p"){const q=kmAt(cx);if(q.tot<=0)return;const k2=Math.max(1,Math.min(60,S.zk*f)),span=q.tot/k2;S.zk=k2;S.zs=k2===1?0:Math.max(0,Math.min(1-1/k2,(q.km-q.f*span)/q.tot))}
  else if(S.view==="m"){const k2=Math.max(1,Math.min(20,S.mk*f)),fx=(cx-r.left)/r.width,fy=(cy-r.top)/r.height,px=S.mx-W/(2*S.mk)+fx*W/S.mk,py=S.my-H/(2*S.mk)+fy*H/S.mk;S.mx=px-fx*W/k2+W/(2*k2);S.my=py-fy*H/k2+H/(2*k2);S.mk=k2;if(k2===1){S.mx=W/2;S.my=H/2}}
  else S.z3=Math.max(.4,Math.min(6,S.z3*f));
  refresh();
}
cv.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.25:.8,e)},{passive:false});
$("#zi").onclick=()=>zoom(1.4);$("#zo").onclick=()=>zoom(1/1.4);
$("#zr").onclick=()=>{S.zk=1;S.zs=0;S.mk=1;S.mx=W/2;S.my=H/2;S.z3=1;refresh()};
$("#pan").oninput=e=>{S.zs=(e.target.value/1000)*(1-1/S.zk);refresh()};

try{const r=JSON.parse(localStorage.getItem("trail-runner")||"{}");if(r.ui!=null)$("#ui").value=r.ui;if(r.pace!=null)$("#pace").value=r.pace}catch(_){}
$("#ui").oninput=$("#pace").oninput=()=>{try{localStorage.setItem("trail-runner",JSON.stringify({ui:$("#ui").value,pace:$("#pace").value}))}catch(_){}refresh()};
/* hover tooltips */
const gt=document.createElement("div");gt.className="gt";gt.hidden=true;document.body.appendChild(gt);
function showTip(el){const r=el.getBoundingClientRect();gt.textContent=el.dataset.tip;gt.hidden=false;const w=gt.offsetWidth;gt.style.left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2))+"px";gt.style.top=(r.bottom+6)+"px"}
document.addEventListener("pointerover",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t&&e.pointerType!=="touch")showTip(t);else gt.hidden=true});
document.addEventListener("focusin",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(t)});
document.addEventListener("focusout",()=>{gt.hidden=true});
document.addEventListener("pointerdown",()=>{gt.hidden=true});
$("#bExp").onclick=()=>{if(!SV.length){$("#err").textContent="ยังไม่มีเส้นทางที่บันทึกไว้";return}const b=new Blob([JSON.stringify({v:3,routes:SV})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="trail-routes.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("#bImp").onclick=()=>$("#jsonIn").click();
$("#jsonIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const d=JSON.parse(rd.result),a=Array.isArray(d)?d:d.routes;if(!Array.isArray(a))throw 0;const have=new Set(SV.map(r=>r.name+"|"+r.tot)),fresh=a.filter(r=>r&&r.segs&&!have.has(r.name+"|"+r.tot));
    if(cloud()){const{error}=await sb.from("routes").insert(fresh.map(r=>{const{id,...rest}=r;return{name:r.name,data:rest}}));if(error)throw error;await loadRoutes()}
    else{S.cmp=[];SV=fresh.concat(SV).slice(0,30);lsSet(SV);renderSaved()}}catch(_){err("อ่านไฟล์สำรองไม่ได้")}};rd.readAsText(f);e.target.value=""};
/* ===== บัญชี + ซิงก์ขึ้นคลาวด์ + Strava (ทำงานเมื่อมี config.js และ /api บน Vercel) ===== */
const CFG=window.APP_CONFIG||{};
const sb=CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
let USER=null,SESS=null,ACT=[],actPage=1,synced=false;
const cloud=()=>!!(sb&&USER);
const err=m=>{$("#err").textContent=m||""};
function renderAcct(){
  const a=$("#acct");
  if(!sb){a.innerHTML='<span class="note" style="margin:0">ยังไม่ได้ตั้งค่า Supabase ใน config.js จึงยังไม่มีบัญชีและ Strava</span>';return}
  const stv='<button class="sbtn" id="bStv" data-tip="ดึงกิจกรรมจาก Strava" aria-label="ดึงกิจกรรมจาก Strava"><span data-ic="act"></span>Strava</button>';
  a.innerHTML=stv+(USER?'<span class="note" style="margin:0">'+esc(USER.email||"")+'</span><button class="ib" id="bOut" data-tip="ออกจากระบบ" aria-label="ออกจากระบบ"><span data-ic="out"></span></button>':'<button class="ib" id="bIn" data-tip="เข้าสู่ระบบเพื่อบันทึกขึ้นบัญชี" aria-label="เข้าสู่ระบบ"><span data-ic="user"></span></button>');
  a.querySelectorAll("[data-ic]").forEach(b=>b.innerHTML=ic(b.dataset.ic));
}
$("#acct").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="bIn")$("#login").hidden=!$("#login").hidden;else if(b.id==="bOut")sb.auth.signOut();else if(b.id==="bStv"){if(!USER){$("#login").hidden=false;$("#loginMsg").textContent="ต้องเข้าสู่ระบบก่อนจึงจะดึงกิจกรรมจาก Strava ได้";$("#email").focus()}else openStrava()}});
$("#loginGo").onclick=async()=>{
  const em=$("#email").value.trim();if(!em||!sb)return;
  $("#loginMsg").textContent="กำลังส่ง…";
  const{error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});
  $("#loginMsg").textContent=error?"ส่งไม่สำเร็จ: "+error.message:"ส่งลิงก์ไปที่อีเมลแล้ว กดลิงก์ในอีเมลเพื่อเข้าสู่ระบบ";
};
async function loadRoutes(){
  if(cloud()){
    const{data,error}=await sb.from("routes").select("id,name,data,created_at").order("created_at",{ascending:false});
    if(error){err("โหลดเส้นทางจากบัญชีไม่สำเร็จ: "+error.message);SV=lsGet()}else SV=data.map(r=>({...r.data,id:r.id,name:r.name}));
  }else SV=lsGet();
  S.cmp=[];renderSaved();
  $("#bUpLocal").hidden=!(cloud()&&!synced&&lsGet().length);
}
$("#bUpLocal").onclick=async()=>{
  const have=new Set(SV.map(r=>r.name+"|"+r.tot)),fresh=lsGet().filter(r=>!have.has(r.name+"|"+r.tot));
  if(fresh.length){const{error}=await sb.from("routes").insert(fresh.map(r=>({name:r.name,data:r})));if(error){err("อัปโหลดไม่สำเร็จ: "+error.message);return}}
  synced=true;await loadRoutes();
};
/* Strava */
const api=p=>fetch(p,{headers:{Authorization:"Bearer "+SESS.access_token}});
async function openStrava(){$("#stv").hidden=false;$("#stv").scrollIntoView({behavior:"smooth",block:"nearest"});await loadActs(true)}
async function loadActs(reset){
  if(reset){ACT=[];actPage=1}
  $("#stvMsg").textContent="กำลังโหลด…";
  const p=new URLSearchParams({page:actPage}),f=$("#dFrom").value,t=$("#dTo").value;
  if(f)p.set("after",Math.floor(new Date(f+"T00:00:00").getTime()/1000));
  if(t)p.set("before",Math.floor(new Date(t+"T23:59:59").getTime()/1000));
  let r;try{r=await api("/api/strava-activities?"+p)}catch(_){$("#stvMsg").textContent="เรียก API ไม่ได้ ต้องใช้บน Vercel ที่ตั้งค่าโฟลเดอร์ api แล้ว";return}
  if(r.status===409){$("#stvMsg").textContent="";$("#stvMore").hidden=true;$("#stvList").innerHTML='<button class="pri" id="stvConn">เชื่อมต่อบัญชี Strava</button><p class="note">ครั้งแรกต้องกดอนุญาตให้แอปอ่านกิจกรรมของคุณ</p>';return}
  if(!r.ok){$("#stvMsg").textContent="โหลดกิจกรรมไม่สำเร็จ ("+r.status+")";return}
  const a=await r.json();ACT=ACT.concat(a);$("#stvMore").hidden=a.length<100;$("#stvMsg").textContent="";renderActs();
}
function renderActs(){
  const q=$("#q").value.trim().toLowerCase(),L=ACT.filter(a=>a.dist>0&&(!q||String(a.name).toLowerCase().includes(q)));
  $("#stvList").innerHTML=L.length?L.map(a=>'<button class="act" data-id="'+a.id+'"><span>'+esc(a.name)+'<br><small>'+esc(new Date(a.date).toLocaleDateString("th-TH"))+' · '+esc(a.type)+'</small></span><span style="text-align:right">'+(a.dist/1000).toFixed(1)+' กม.<br><small>ขึ้น '+Math.round(a.gain||0)+' ม.</small></span></button>').join(""):'<p class="note">ไม่พบกิจกรรม</p>';
}
$("#stvList").onclick=async e=>{
  if(e.target.closest("#stvConn")){try{const r=await api("/api/strava-connect"),j=await r.json();if(j.url)location.href=j.url;else $("#stvMsg").textContent="เชื่อมต่อไม่ได้ ตรวจค่า Environment Variables บน Vercel"}catch(_){$("#stvMsg").textContent="เรียก API ไม่ได้"}return}
  const b=e.target.closest("[data-id]");if(!b)return;
  const a=ACT.find(x=>String(x.id)===b.dataset.id);
  $("#stvMsg").textContent="กำลังดึงข้อมูลเส้นทาง…";
  try{const r=await api("/api/strava-stream?id="+b.dataset.id);if(!r.ok)throw 0;const j=await r.json();if(!j.latlng||!j.altitude)throw 1;
    importPts(j.latlng.map((ll,i)=>[ll[0],ll[1],j.altitude[i]]).filter(p=>p[2]!=null),a?a.name:"Strava");
    $("#stvMsg").textContent="";$("#stv").hidden=true}
  catch(x){$("#stvMsg").textContent=x===1?"กิจกรรมนี้ไม่มีข้อมูลพิกัดหรือความสูง":"ดึงข้อมูลไม่สำเร็จ"}
};
$("#q").oninput=renderActs;
$("#dFrom").onchange=$("#dTo").onchange=()=>loadActs(true);
$("#stvMore").onclick=()=>{actPage++;loadActs(false)};
$("#stvX").onclick=()=>{$("#stv").hidden=true};
async function initAuth(){
  renderAcct();if(!sb)return;
  const{data}=await sb.auth.getSession();SESS=data.session;USER=SESS?SESS.user:null;renderAcct();await loadRoutes();
  sb.auth.onAuthStateChange((ev,s)=>{const was=USER&&USER.id;SESS=s;USER=s?s.user:null;renderAcct();if((USER&&USER.id)!==was){$("#login").hidden=true;loadRoutes()}});
  if(new URLSearchParams(location.search).get("strava")==="connected"){history.replaceState(null,"",location.pathname);if(USER)openStrava()}
}
SV=lsGet();sync();renderSaved();render();initAuth();
</script>
